<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Stylized hand sign with AI neural network connections">
  <defs>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hand-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2545" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1230" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="stroke-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="transparent"/>

  <!-- Ambient glows -->
  <circle cx="1120" cy="260" r="360" fill="url(#glow-blue)"/>
  <circle cx="360" cy="660" r="380" fill="url(#glow-violet)"/>

  <!-- Neural network connections (decorative) -->
  <g stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.2" fill="none">
    <path d="M120 180 L320 320 L520 200 L760 300 L980 160 L1240 260 L1320 480"/>
    <path d="M240 120 L360 260 L600 140 L820 240 L1080 200 L1260 120"/>
    <path d="M160 520 L380 480 L560 620 L800 560 L1020 680 L1280 600"/>
    <path d="M300 760 L540 700 L760 820 L1000 740 L1240 820"/>
  </g>

  <!-- Neural nodes -->
  <g fill="#22d3ee" fill-opacity="0.5" filter="url(#soft)">
    <circle cx="120" cy="180" r="5"/><circle cx="320" cy="320" r="6"/>
    <circle cx="520" cy="200" r="5"/><circle cx="760" cy="300" r="7"/>
    <circle cx="980" cy="160" r="5"/><circle cx="1240" cy="260" r="6"/>
    <circle cx="1320" cy="480" r="5"/><circle cx="240" cy="120" r="5"/>
    <circle cx="360" cy="260" r="5"/><circle cx="600" cy="140" r="6"/>
    <circle cx="820" cy="240" r="5"/><circle cx="1080" cy="200" r="6"/>
    <circle cx="1260" cy="120" r="5"/><circle cx="160" cy="520" r="5"/>
    <circle cx="380" cy="480" r="6"/><circle cx="560" cy="620" r="5"/>
    <circle cx="800" cy="560" r="6"/><circle cx="1020" cy="680" r="5"/>
    <circle cx="1280" cy="600" r="5"/><circle cx="300" cy="760" r="5"/>
    <circle cx="540" cy="700" r="6"/><circle cx="760" cy="820" r="5"/>
    <circle cx="1000" cy="740" r="5"/><circle cx="1240" cy="820" r="6"/>
  </g>
  <g fill="#a78bfa" fill-opacity="0.5" filter="url(#soft)">
    <circle cx="220" cy="420" r="5"/><circle cx="460" cy="520" r="6"/>
    <circle cx="700" cy="460" r="5"/><circle cx="900" cy="520" r="6"/>
    <circle cx="1140" cy="420" r="5"/><circle cx="420" cy="760" r="5"/>
    <circle cx="860" cy="720" r="5"/><circle cx="1160" cy="720" r="5"/>
  </g>

  <!-- Stylized open hand (palm + fingers + thumb) -->
  <g transform="translate(560 330)" stroke="url(#stroke-glow)" stroke-width="2.4" fill="url(#hand-fill)">
    <!-- fingers -->
    <rect x="18" y="-120" width="34" height="150" rx="17"/>
    <rect x="62" y="-136" width="36" height="168" rx="18"/>
    <rect x="108" y="-124" width="36" height="156" rx="18"/>
    <rect x="152" y="-96" width="34" height="128" rx="17"/>
    <!-- palm -->
    <rect x="0" y="0" width="204" height="188" rx="52"/>
    <!-- thumb -->
    <path d="M-34 44 C-34 12 -12 -4 12 -4 C28 -4 40 8 40 26 L40 78 L-2 96 Z" rx="0"/>
  </g>

  <!-- Hand node highlights -->
  <g fill="#22d3ee" fill-opacity="0.75" filter="url(#soft)">
    <circle cx="612" cy="258" r="4"/><circle cx="662" cy="240" r="4"/>
    <circle cx="712" cy="252" r="4"/><circle cx="760" cy="280" r="4"/>
    <circle cx="560" cy="392" r="5"/><circle cx="764" cy="392" r="5"/>
  </g>
  <g fill="#a78bfa" fill-opacity="0.7" filter="url(#soft)">
    <circle cx="560" cy="470" r="4"/><circle cx="660" cy="500" r="4"/>
    <circle cx="764" cy="470" r="4"/>
  </g>

  <!-- Digital particles -->
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="480" cy="140" r="2"/><circle cx="880" cy="120" r="2"/>
    <circle cx="1180" cy="340" r="2"/><circle cx="340" cy="620" r="2"/>
    <circle cx="1120" cy="560" r="2"/><circle cx="680" cy="720" r="2"/>
    <circle cx="150" cy="300" r="2"/><circle cx="1300" cy="720" r="2"/>
  </g>
</svg>
